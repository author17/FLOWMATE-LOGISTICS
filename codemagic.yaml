workflows:
  ios-release:
    name: FLOWMATE iOS
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: FLOWMATE_ASC
    environment:
      groups:
        - flowmate_k3
      vars:
        VITE_API_BASE: "https://flowmate-logistics-production.up.railway.app"
        APP_STORE_APPLE_ID: "6818750307"
        BUNDLE_ID: "com.flowmate.logistics"
      node: 22
    scripts:
      - name: Build web app
        script: cd frontend && npm ci && npm run build:mobile
      - name: Sync Capacitor
        script: cd mobile && npm ci && npx cap sync ios
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          echo "key length: ${#CERTIFICATE_KEY_B64}"
          echo "$CERTIFICATE_KEY_B64" | base64 --decode > /tmp/cert_key
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key @file:/tmp/cert_key
          keychain add-certificates
      - name: Apply profiles
        script: xcode-project use-profiles --project mobile/ios/App/App.xcodeproj
      - name: Build number
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd mobile/ios/App && agvtool new-version -all $((LATEST + 1))
      - name: Build ipa
        script: xcode-project build-ipa --project mobile/ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true




