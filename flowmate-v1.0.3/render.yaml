# Render.com blueprint: two services from the same repo = real system + practice copy.
databases:
  - { name: flowmate-db, plan: basic-256mb, databaseName: flowmate, user: flowmate }
  - { name: flowmate-demo-db, plan: basic-256mb, databaseName: flowmate_demo, user: flowmate }
services:
  - type: web
    name: flowmate
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - { key: ENV, value: production }
      - { key: SECRET_KEY, generateValue: true }
      - { key: DATABASE_URL, fromDatabase: { name: flowmate-db, property: connectionString } }
    disk: { name: files, mountPath: /data, sizeGB: 5 }
  - type: web
    name: flowmate-practice
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - { key: ENV, value: production }
      - { key: DEMO_MODE, value: "1" }
      - { key: SECRET_KEY, generateValue: true }
      - { key: DATABASE_URL, fromDatabase: { name: flowmate-demo-db, property: connectionString } }
    disk: { name: files, mountPath: /data, sizeGB: 1 }
